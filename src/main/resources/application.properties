# Veritabanı Adresi
spring.datasource.url=jdbc:postgresql://ep-morning-unit-as3jxork-pooler.c-4.eu-central-1.aws.neon.tech/neondb?sslmode=require

# Kullanıcı Adı
spring.datasource.username=neondb_owner

# Şifre (Neon'daki göz simgesine basıp aldığın şifreyi buraya yapıştır)
spring.datasource.password=${DB_PASSWORD}

# Sürücü
spring.datasource.driver-class-name=org.postgresql.Driver

# Tablo Otomasyonu ve SQL Logları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true