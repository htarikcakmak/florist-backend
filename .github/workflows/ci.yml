name: CI — Flowerist Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: flowerist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build
        env:
          DB_PASSWORD: testpass
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/flowerist_test
          SPRING_DATASOURCE_USERNAME: testuser
        run: ./mvnw clean package -DskipTests

      - name: Run Unit Tests
        run: ./mvnw test -Dtest="JwtUtilTest" -DfailIfNoTests=false
