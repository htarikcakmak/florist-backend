services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowerist
      POSTGRES_USER: flowerist_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/flowerist
      SPRING_DATASOURCE_USERNAME: flowerist_user
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  pgdata:
